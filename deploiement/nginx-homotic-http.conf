# Etape intermediaire : Homotic en HTTP seul, avant d'avoir le certificat.
#
# Deux roles :
#   - servir la verification de certbot (/.well-known/acme-challenge/) ;
#   - rendre l'application accessible tout de suite, sans attendre le TLS.
#
# Installation :
#   sudo cp deploiement/nginx-homotic-http.conf /etc/nginx/sites-available/homotic
#   sudo ln -s /etc/nginx/sites-available/homotic /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Puis, une fois le certificat obtenu, remplacer par nginx-homotic.conf.
#
# ATTENTION : en HTTP, le mot de passe circule en clair. Ne pas se connecter
# depuis l'exterieur tant que le certificat n'est pas en place — la
# verification de certbot, elle, n'a besoin d'aucune identification.

server {
    listen 80;
    listen [::]:80;

    # Nom explicite : ce bloc l'emporte sur le site « default », quel que
    # soit ce que celui-ci contient.
    server_name homotic.rodica-romain.fr;

    # Verification de certbot. Doit passer avant tout le reste.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    location /static/ {
        alias /home/apps/app_python/Homotic/staticfiles/;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
