# nginx devant Homotic : terminaison HTTPS, fichiers statiques, et
# limitation des tentatives de connexion.
#
# IMPORTANT : obtenir le certificat AVANT d'installer ce fichier, sinon
# « nginx -t » echoue sur un certificat inexistant et le service ne recharge
# plus du tout. Procedure complete dans docs/10-mise-en-ligne.md :
#
#   sudo certbot certonly --webroot -w /var/www/html -d homotic.rodica-romain.fr
#   sudo cp deploiement/nginx-homotic.conf /etc/nginx/sites-available/homotic
#   sudo ln -s /etc/nginx/sites-available/homotic /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# Limitation de debit sur la page de connexion. Le formulaire sera trouve
# par les robots dans les heures qui suivent l'ouverture du port : sans
# cette limite, ils peuvent essayer des milliers de mots de passe par
# minute. 5 tentatives par minute et par adresse IP ne genent pas un humain
# et rendent l'attaque par force brute inexploitable.
limit_req_zone $binary_remote_addr zone=homotic_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name homotic.rodica-romain.fr;

    # Tout passe en HTTPS. Certbot a besoin de laisser passer sa
    # verification, d'ou l'exception sur .well-known.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name homotic.rodica-romain.fr;

    ssl_certificate     /etc/letsencrypt/live/homotic.rodica-romain.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/homotic.rodica-romain.fr/privkey.pem;

    # Reglages TLS ecrits ici plutot qu'importes de « options-ssl-nginx.conf » :
    # ce fichier n'est fourni que par le greffon python3-certbot-nginx, inutile
    # quand le certificat est obtenu en mode « certonly --webroot ». Une
    # dependance de moins, et une configuration lisible sur place.
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Un tableau de bord domestique ne recoit pas de gros envois.
    client_max_body_size 8m;

    # Fichiers statiques servis directement : hors DEBUG, Django ne les sert
    # plus lui-meme. Repertoire produit par « manage.py collectstatic ».
    location /static/ {
        alias /home/apps/app_python/Homotic/staticfiles/;
        access_log off;
        expires 30d;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Page de connexion : meme traitement que le reste, plus la limite.
    # « burst=3 nodelay » tolere une petite rafale (mot de passe retape
    # plusieurs fois de suite) sans ouvrir la porte a un balayage.
    location /comptes/login/ {
        limit_req zone=homotic_login burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # L'interface d'administration Django n'a aucune raison d'etre exposee :
    # le pilotage se fait par le tableau de bord. La laisser ouverte double
    # la surface d'attaque pour un usage nul depuis l'exterieur. En cas de
    # besoin, y acceder par un tunnel SSH :
    #   ssh -L 8000:127.0.0.1:8000 utilisateur@serveur
    #   puis http://127.0.0.1:8000/admin/
    location /admin/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Sans cet en-tete, Django croit la requete en clair : il refuse de
        # poser les cookies « secure » et la connexion devient impossible.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le tableau de bord interroge des API externes (Overkiz, Solcast) :
        # une page peut mettre quelques secondes a repondre.
        proxy_read_timeout 120s;
    }
}
